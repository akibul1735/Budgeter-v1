name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 9.3.1 || true
            chmod +x gradlew || true
          fi

      - name: Restore Keystores from Base64
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug keystore from repository base64 file..."
            base64 --decode debug.keystore.base64 > debug.keystore || true
          fi
          if [ -f "release.keystore.base64" ] && [ ! -f "release.keystore" ]; then
            echo "Decoding release keystore from repository base64 file..."
            base64 --decode release.keystore.base64 > release.keystore || true
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: budgeter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
