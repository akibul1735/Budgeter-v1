name: Build & Release Budgeter

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK & Zip artifacts'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Android App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle wrapper files..."
            gradle wrapper --gradle-version 9.3.1 || true
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Setup Environment & Secrets
        run: |
          if [ ! -f ".env.example" ]; then
            echo 'GEMINI_API_KEY=""' > .env.example
          fi
          if [ ! -f ".env" ]; then
            echo 'GEMINI_API_KEY=""' > .env
          fi

      - name: Configure Keystore from Secrets & Repository
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -di > release.keystore 2>/dev/null || echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > release.keystore || true
          elif [ -f "release.keystore.base64" ]; then
            echo "Decoding release keystore from repository base64 file..."
            base64 -di release.keystore.base64 > release.keystore 2>/dev/null || base64 --decode release.keystore.base64 > release.keystore || true
          fi

          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug keystore from repository base64 file..."
            base64 -di debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore || true
          fi

          # Ensure debug.keystore is always available as a fallback
          if [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Verify release keystore validity if password provided; otherwise use debug fallback
          if [ -s "release.keystore" ] && [ -n "$STORE_PASSWORD" ]; then
            if ! keytool -list -keystore release.keystore -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
              echo "::warning::release.keystore password check failed with provided STORE_PASSWORD. Falling back to debug signing for release build."
              rm -f release.keystore release.keystore.base64
            fi
          elif [ -s "release.keystore" ] && [ -z "$STORE_PASSWORD" ]; then
            echo "No STORE_PASSWORD provided; removing release.keystore to use debug signing fallback."
            rm -f release.keystore release.keystore.base64
          fi

      - name: Run Unit & Robolectric Tests
        id: unit-tests
        run: |
          mkdir -p build_logs
          set -o pipefail
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build_logs/test_unit.log
          else
            gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build_logs/test_unit.log
          fi

      - name: Build Release APK
        id: build-apk
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'budgeter' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8"
        run: |
          mkdir -p build_logs build_output
          
          # If release.keystore is missing or invalid with the password, clear environment secrets so Gradle signs with debugConfig
          if [ ! -f "release.keystore" ] || [ -z "$STORE_PASSWORD" ] || ! keytool -list -keystore release.keystore -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "Signing with debug configuration..."
            export STORE_PASSWORD=""
            export KEYSTORE_PASSWORD=""
            export KEY_PASSWORD=""
            unset STORE_PASSWORD
            unset KEYSTORE_PASSWORD
            unset KEY_PASSWORD
            rm -f release.keystore release.keystore.base64
          fi

          set +e
          set -o pipefail
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease --no-daemon --stacktrace --info 2>&1 | tee build_logs/build_release.log
            GRADLE_EXIT_CODE=$?
          else
            gradle assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease --no-daemon --stacktrace --info 2>&1 | tee build_logs/build_release.log
            GRADLE_EXIT_CODE=$?
          fi

          if [ $GRADLE_EXIT_CODE -ne 0 ]; then
            echo "::error::Gradle assembleRelease failed with exit code $GRADLE_EXIT_CODE"
            echo "### ❌ Gradle assembleRelease Failed" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Click to view Gradle Build Error Log (last 200 lines)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 200 build_logs/build_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            exit $GRADLE_EXIT_CODE
          else
            echo "### ✅ Gradle assembleRelease Succeeded" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Prepare Release Artifacts (APK)
        id: prepare-artifacts
        run: |
          mkdir -p build_output
          # Locate release apk and rename to Budgeter-release.apk
          RELEASE_APK=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -n "$RELEASE_APK" ]; then
            echo "Found release APK: $RELEASE_APK"
            cp "$RELEASE_APK" build_output/Budgeter-release.apk
          else
            echo "::error::No APK found in app/build/outputs/apk!"
            echo "### ❌ No APK Found in Build Outputs" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Release artifacts ready:"
          ls -la build_output/

      - name: Collect Diagnostic Reports & Logs
        if: always()
        run: |
          mkdir -p build_logs/reports
          if [ -d "app/build/reports" ]; then
            cp -r app/build/reports/* build_logs/reports/ 2>/dev/null || true
          fi
          if [ -d "app/build/test-results" ]; then
            mkdir -p build_logs/test-results
            cp -r app/build/test-results/* build_logs/test-results/ 2>/dev/null || true
          fi

      - name: Upload Error Logs & Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budgeter-build-error-logs
          path: build_logs/
          retention-days: 7

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: budgeter-release-artifacts
          path: build_output/Budgeter-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v3.6.{0}', github.run_number) }}
          name: "Budgeter-release"
          files: |
            build_output/Budgeter-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Old Releases (Keep Latest 5)
        if: github.event_name != 'pull_request'
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

