name: Build & Release Budgeter

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK & Zip artifacts'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Android App
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 9.3.1 || true
            chmod +x gradlew || true
          fi

      - name: Setup Environment & Secrets
        run: |
          if [ ! -f ".env.example" ]; then
            echo 'GEMINI_API_KEY=""' > .env.example
          fi
          if [ ! -f ".env" ]; then
            echo 'GEMINI_API_KEY=""' > .env
          fi

      - name: Configure Keystore from Secrets & Repository
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > release.keystore
          elif [ -f "release.keystore.base64" ]; then
            echo "Decoding release keystore from repository base64 file..."
            base64 --decode release.keystore.base64 > release.keystore
          fi
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug keystore from repository base64 file..."
            base64 --decode debug.keystore.base64 > debug.keystore || true
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'budgeter' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Artifacts (APK)
        id: prepare-artifacts
        run: |
          mkdir -p build_output
          # Locate release apk and rename to Budgeter-release.apk
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" build_output/Budgeter-release.apk
          else
            # Fallback if unaligned or unsigned apk exists
            FALLBACK_APK=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
            [ -n "$FALLBACK_APK" ] && cp "$FALLBACK_APK" build_output/Budgeter-release.apk
          fi
          echo "Release artifacts ready:"
          ls -la build_output/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: budgeter-release-artifacts
          path: build_output/*
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v3.6.{0}', github.run_number) }}
          name: "Budgeter-release"
          files: |
            build_output/Budgeter-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

